name: Daily FMES Scan

on:
  schedule:
    # 10:30 UTC = 16:00 IST (after NSE close at 15:30 IST)
    - cron: "30 10 * * 1-5"   # weekdays only
  workflow_dispatch: {}        # allow manual trigger from Actions UI

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FMES scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          FMES_TIMEFRAME:     "1d"
          FMES_UNIVERSES:     "nifty500,forex,us_majors"
          FMES_PIVOT_LEN:     "7"
          FMES_REQUIRE_HTF_TREND: "true"
          FMES_REQUIRE_LQ_PLUS:   "true"
          FMES_MAX_SETUP_AGE_BARS: "10"
        run: python main.py

      - name: Upload scan snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmes-scan-${{ github.run_number }}
          path: data/latest_scan.json
          if-no-files-found: warn
          retention-days: 30
